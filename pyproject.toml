[project]
name = "docsprint"
version = "0.1.0"
description = "AI Document Processing SaaS — upload docs, get structured JSON"
readme = "SPEC.md"
authors = [
    { name = "noob_boy", email = "bhavya260@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "rq>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.5.0",
    "pillow>=12.0.0",
    "pymupdf>=1.28.0",
    "rich>=15.0.0",
    "typer>=0.26.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.2.0",
    "httpx>=0.28.0",
    "transformers>=5.13.0",
    "bitsandbytes>=0.49.2",
    "accelerate>=1.14.0",
    "torch>=2.11.0",
    "torchvision>=0.16.0",
]

[project.scripts]
docsprint = "docsprint.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
